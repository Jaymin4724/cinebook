name: cinebook

services:
  # ---------------------------------------------------------------------------
  # api — our FastAPI application
  # ---------------------------------------------------------------------------
  api:
    build: .
    entrypoint : ["sh","/cinebook/entrypoint.sh"]
    command: ["python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    container_name: fastapi_app_container
    # Start the app with auto-reload (code changes restart the server) and
    # debugpy, so you can attach a debugger on port 5678.
    command:
      - python
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5678
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"                   # App:     http://localhost:8000
      - "5678:5678"                   # Debugger: attach your editor here
    env_file:
      - .env.docker                   # Loads environment variables (DB URL, secrets, ...)
    restart: unless-stopped           # Auto-restart unless you stop it yourself
    # Wait until the databases are actually ready (not just started) before
    # launching the app, so migrations and queries don't fail on startup.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    # Live-sync code into the running container ("docker compose up --watch").
    develop:
      watch:
        - action: sync                # Copy code changes instantly (no rebuild)
          path: ./app
          target: /cinebook/app
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  # ---------------------------------------------------------------------------
  # db — PostgreSQL database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine         # "alpine" = tiny, lightweight variant
    container_name: postgres_container
    ports:
      - "5431:5432"                   # Host port 5431 -> container port 5432
    env_file:
      - .env.docker                   # Provides POSTGRES_USER / PASSWORD / DB
    volumes:
      - postgres_data:/var/lib/postgresql/data   # Persist data between restarts
    restart: unless-stopped
    # "healthy" once Postgres can accept connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # redis — in-memory cache / key-value store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: redis_container
    volumes:
      - redis_data:/data              # Persist cached data between restarts
    restart: unless-stopped
    # "healthy" once Redis replies to a ping.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # elasticsearch — full-text search engine
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:9.2.7
    container_name: elasticsearch_container
    env_file:
      - .env.docker                   # Provides single-node / security settings
    volumes:
      - elastic_data:/usr/share/elasticsearch/data   # Persist search indexes
    restart: unless-stopped
    # "healthy" once Elasticsearch is listening on port 9200.
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9200"]
      interval: 10s
      timeout: 5s
      retries: 5

# ---------------------------------------------------------------------------
# Named volumes — where data is stored so it survives container restarts.
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  elastic_data:
